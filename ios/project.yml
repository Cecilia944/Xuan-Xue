name: ZiweiApp
options:
  bundleIdPrefix: com.ziwei
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ZiweiCore:
    path: Packages/ZiweiCore
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
targets:
  ZiweiApp:
    type: application
    platform: iOS
    sources:
      - path: ZiweiApp
        excludes:
          - Resources/PrivacyInfo.xcprivacy
    resources:
      - path: ZiweiApp/Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: ZiweiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ziwei.app
        PRODUCT_NAME: 紫微斗数
        INFOPLIST_KEY_CFBundleDisplayName: 紫微斗数
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    scheme:
      testTargets:
        - ZiweiAppUITests
  ZiweiAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/ZiweiAppUITests
    dependencies:
      - target: ZiweiApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ziwei.app.uitests
        GENERATE_INFOPLIST_FILE: YES
